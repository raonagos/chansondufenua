# The Tahitian chrome. A first pass, written without a native speaker.
#
# Unlike the other two this file may be **incomplete**: a key it does not carry
# is served from English, then French, so an unfinished translation shows a
# reader a real sentence instead of a blank or a key name. Delete a line,
# restart the server, and that one string changes — no `cargo build`, which is
# the whole reason the catalog is a file.
#
# The format is `fr.toml`'s.

