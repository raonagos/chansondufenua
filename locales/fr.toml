# The French chrome — the site's default language.
#
# One key per line, `name = "words"`; a line starting with `#` is a comment.
# The name is `i18n::Key`'s, in snake_case: listing a name here does not put it
# on a page, the enum has to name it too. A name this file does not know, or a
# key missing from it, stops the server at boot — loud on purpose, so that a
# half-copied file cannot serve a key name to a reader.
#
# Read at startup and never compiled: correcting a sentence is an edit and a
# restart, not a `cargo build`.

