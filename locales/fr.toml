# The song page's own sentence (step 50). The title goes in front of it, and
# `{artists}` is filled with the credits; a song with no credited artist takes
# the solo line, which is the same sentence without the clause. The French is
# v3's, byte for byte — moving the sentence here is what lets an English or
# Tahitian page hand a search engine its own language.
