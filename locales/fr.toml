# --- the terms page (step 46) ---
#
# The owner's own statements about the site — who publishes it, whose the lyrics
# are, what happens to a lyric that is wrong. Prose like the block above, and in
# `i18n::Key::PROSE` for the same reason: none of it has a `ty.toml` line, so a
# Tahitian reader is served the English rather than an invented translation.
#
# `terms_title` is also the footer link's word: the page has one name, and a
# second word for the same page would be a second thing to keep true.
terms_title = "Mentions légales"
