# --- the site's own prose (step 36) ---
#
# Not chrome: the maintainer's sentences. This file is where an English reader
# reads them, and also where the Tahitian comes from — none of these keys has a
# `ty.toml` line, so `ty → en → fr` serves the English on a Tahitian page (see
# `i18n::Key::PROSE`). The French on the other side is v3's, byte for byte.
