home_synopsis = "Discover a musical world of its own, where the art of chords and a command of melody lift your music to new heights. Let the poetry of the lyrics carry you away — a true window on the Tahitian soul, and a lyrical, moving journey. Dive into a refined collection of Tahitian songs, carefully chosen to bring tradition and modernity together, for a rewarding and unforgettable musical experience. Discover captivating melodies and rhythms that celebrate the cultural wealth of Tahiti, and invite every listener to explore and enjoy the beauty and depth of this unique culture."
