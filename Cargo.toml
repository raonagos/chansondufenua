[package]
name = "chansondufenua"
version = "4.0.0"
edition = "2024"
rust-version = "1.98"
description = "Sing tahitian songs with lyrics and chords."
homepage = "https://www.chansondufenua.pf"
repository = "https://github.com/raonagos/chansondufenua"
authors = ["tetuaoro <65575727+tetuaoro@users.noreply.github.com>"]

[dependencies]
topcoat = { version = "0.10.0", features = ["sitemap", "tailwind"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Embedded SQLite. `sqlite` bundles libsqlite3 (via libsqlite3-sys) so nothing
# needs installing on the host; `macros` is only for `sqlx::migrate!` and the
# `FromRow` derive — the compile-time-checked `query!` family is deliberately
# unused, so builds never need a live DATABASE_URL.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ammonia = "4.2.1"
regex-lite = "0.1.9"
thiserror = "2.0.21"

# `tailwind` on the build dependency only: `BuildConfig::render()` runs in
# build.rs to scan the sources and emit the stylesheet as an asset.
[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 12
panic = "abort"
