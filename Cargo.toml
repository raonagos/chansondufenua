[package]
name = "chansondufenua"
version = "4.0.0"
edition = "2024"
rust-version = "1.98"
description = "Sing tahitian songs with lyrics and chords."
homepage = "https://www.chansondufenua.pf"
repository = "https://github.com/raonagos/chansondufenua"
authors = ["tetuaoro <65575727+tetuaoro@users.noreply.github.com>"]

[dependencies]
topcoat = { version = "0.10.0", features = [
    "sitemap",
    "tailwind",
    # `font-fontsource` pulls in the vendored Fontsource catalog and the `font!`
    # macros. `font` and `asset` are already in the default set, and `asset` is
    # what makes `host: Asset` work — fonts are bundled and served from this
    # binary rather than fetched from a CDN. See `src/ui/fonts.rs`.
    "font-fontsource",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Embedded SQLite. `sqlite` bundles libsqlite3 (via libsqlite3-sys) so nothing
# needs installing on the host; `macros` is only for `sqlx::migrate!` and the
# `FromRow` derive — the compile-time-checked `query!` family is deliberately
# unused, so builds never need a live DATABASE_URL.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ammonia = "4.2.1"
regex-lite = "0.1.9"
thiserror = "2.0.21"
# The social cards (`src/routes/og.rs`). `PLAN.md` §7 chose pure-Rust rendering
# over headless Chromium, so `fontdue` rasterises the glyphs and `png` encodes
# the canvas — neither pulls a browser into the deployment.
#
# `epaint_default_fonts` is a data-only crate: the four faces an egui app falls
# back to, exposed as `&'static [u8]`, and it is here because the site's own
# faces are served as `woff2`, which no rasteriser reads. Only its `UBUNTU_LIGHT`
# is used. See the module docs for why a build-time download was rejected.
fontdue = "0.9.4"
png = "0.18.1"
epaint_default_fonts = "0.36.2"
# `topcoat::router::Body` is built from `Bytes`, not from `Vec<u8>`, and an
# image is not a `String`. Already in the tree under the HTTP stack.
bytes = "1"

# `tailwind` on the build dependency only: `BuildConfig::render()` runs in
# build.rs to scan the sources and emit the stylesheet as an asset.
[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 12
panic = "abort"
